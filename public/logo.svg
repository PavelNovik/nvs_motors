<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 236" role="img" aria-labelledby="t">
  <title id="t">NVS Motors</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".28" stop-color="#f4cb62"/>
      <stop offset=".5" stop-color="#a8761f"/>
      <stop offset=".56" stop-color="#e9b94a"/>
      <stop offset=".8" stop-color="#fbe08c"/>
      <stop offset="1" stop-color="#8a5b10"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeaa0"/>
      <stop offset=".5" stop-color="#9c6a16"/>
      <stop offset="1" stop-color="#f1c45a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset=".3" stop-color="#ef2a2f"/>
      <stop offset=".52" stop-color="#8f0a10"/>
      <stop offset=".6" stop-color="#d6161f"/>
      <stop offset="1" stop-color="#6a0509"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset=".5" stop-color="#121214"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3121c" stop-opacity="0"/>
      <stop offset=".25" stop-color="#e3121c"/>
      <stop offset=".75" stop-color="#ff4a4a"/>
      <stop offset="1" stop-color="#e3121c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- силуэт купе над надписью -->
  <path d="M18 44 C70 30 112 14 168 11 C214 8 246 18 282 32 C304 34 322 38 336 44" fill="none" stroke="url(#car)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M120 26 C150 22 196 20 236 24" fill="none" stroke="url(#car)" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>

  <!-- NVS -->
  <g transform="translate(16 46) skewX(-11) translate(20 0)" fill="url(#gold)" stroke="#3b2605" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">
    <path d="M0 100V0h26l32 58V0h26v100H58L26 42v58z"/>
    <path d="M92 0h27l17 64 17-64h27l-30 100h-28z"/>
    <path d="M200 0h70v22h-54v17h42q12 0 12 12v37q0 12-12 12h-70V78h54V61h-42q-12 0-12-12V12q0-12 12-12z"/>
  </g>

  <!-- щит со скрещёнными ключами -->
  <g transform="translate(316 32)">
    <path d="M52 0 104 15v46q0 40-52 63Q0 101 0 61V15z" fill="url(#shield)" stroke="url(#goldEdge)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M52 9 95 21v39q0 33-43 53Q9 93 9 60V21z" fill="none" stroke="#e3121c" stroke-width="1.4" opacity=".7"/>
    <g fill="url(#gold)" stroke="#3b2605" stroke-width="1.2">
