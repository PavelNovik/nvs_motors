        <circle cx="0" cy="-34" r="14"/><rect x="-5.5" y="-50" width="11" height="17" fill="#151517" stroke="none"/>
        <circle cx="0" cy="34" r="11"/>
        <circle cx="0" cy="34" r="5" fill="#0b0b0c"/>
      </g>
      <g transform="translate(52 62) rotate(-45)">
        <rect x="-5" y="-30" width="10" height="58" rx="4"/>
        <circle cx="0" cy="-34" r="14"/><rect x="-5.5" y="-50" width="11" height="17" fill="#151517" stroke="none"/>
        <circle cx="0" cy="34" r="11"/>
        <circle cx="0" cy="34" r="5" fill="#0b0b0c"/>
      </g>
    </g>
  </g>

  <!-- MOTORS -->
  <g transform="translate(8 164) skewX(-11) translate(14 0)" fill="url(#red)" stroke="#f1c45a" stroke-width="2" stroke-linejoin="round" paint-order="stroke">
